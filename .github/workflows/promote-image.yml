name: Promote Images

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA tag to promote'
        required: true
      services:
        description: 'Comma-separated services to promote: backend,frontend or both'
        required: true
        default: 'backend,frontend'
      deploy:
        description: 'Whether to update k8s deployments after promotion (true/false)'
        required: false
        default: 'false'

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote images
        env:
          REGISTRY: ghcr.io
          IMAGE_PREFIX: ${{ github.repository_owner }}/prove
          SHA: ${{ github.event.inputs.sha }}
          SERVICES: ${{ github.event.inputs.services }}
        run: |
          set -e
          IFS=',' read -ra SRVS <<< "$SERVICES"
          for s in "${SRVS[@]}"; do
            s=$(echo $s | xargs)
            SRC="$REGISTRY/${IMAGE_PREFIX}-$s:$SHA"
            PROD_TAG="$REGISTRY/${IMAGE_PREFIX}-$s:prod"
            LATEST_PROD_TAG="$REGISTRY/${IMAGE_PREFIX}-$s:latest-prod"
            echo "Promoting $SRC -> $PROD_TAG and $LATEST_PROD_TAG"
            docker pull "$SRC"
            docker tag "$SRC" "$PROD_TAG"
            docker tag "$SRC" "$LATEST_PROD_TAG"
            docker push "$PROD_TAG"
            docker push "$LATEST_PROD_TAG"
          done

  deploy:
    needs: promote
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.deploy == 'true' && secrets.KUBE_CONFIG != '' }}
    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure Kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig

      - name: Update k8s images
        env:
          IMAGE_PREFIX: ${{ github.repository_owner }}/prove
          SHA: ${{ github.event.inputs.sha }}
          SERVICES: ${{ github.event.inputs.services }}
        run: |
          set -e
          IFS=',' read -ra SRVS <<< "$SERVICES"
          for s in "${SRVS[@]}"; do
            s=$(echo $s | xargs)
            IMAGE=ghcr.io/${IMAGE_PREFIX}-$s:$SHA
            echo "Setting image for deployment prove-$s to $IMAGE"
            kubectl set image deployment/prove-$s $s=$IMAGE --namespace=default || true
          done
