apiVersion: apps/v1
kind: Deployment
metadata:
  name: prove-mongo
  labels:
    app: prove-mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prove-mongo
  template:
    metadata:
      labels:
        app: prove-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:6.0
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongo-pvc
