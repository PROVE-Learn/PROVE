apiVersion: apps/v1
kind: Deployment
metadata:
  name: prove-backend
  labels:
    app: prove-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prove-backend
  template:
    metadata:
      labels:
        app: prove-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/<your-org>/prove-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: prove-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"